<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог авто - Выбор</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Зона доверия -->
    <div class="trust-bar">
        <span><i class="fas fa-eye"></i> Без скрытых платежей</span>
        <span><i class="fas fa-clock"></i> Возврат депозита за 1 час</span>
        <span><i class="fab fa-whatsapp"></i> Круглосуточная техподдержка в WhatsApp</span>
    </div>

    <header>
        <div class="logo" onclick="location.href='index.html'">AutoRent<span>Pro</span></div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog.html" class="active">Автомобили</a>
            <a href="contacts.html">Контакты</a>
        </nav>
        <div class="theme-switch-wrapper">
            <i class="fas fa-sun"></i>
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider round"></span>
            </label>
            <i class="fas fa-moon"></i>
        </div>
    </header>

    <div class="page-title">
        <h1></h1>
        <!-- Кнопка "На главную" УДАЛЕНА -->
    </div>

    <div class="catalog-layout">
        <aside class="filters-sidebar">
            <h3>Умный поиск</h3>
            <div class="filter-group">
                <label>Марка</label>
                <select id="brand-filter">
                    <option>Любая</option><option>Toyota</option><option>Hyundai</option><option>Kia</option>
                    <option>BMW</option><option>Mercedes</option><option>Renault</option><option>Skoda</option>
                    <option>Volkswagen</option><option>Nissan</option><option>Mitsubishi</option><option>Ford</option>
                    <option>Chevrolet</option><option>Audi</option><option>Volvo</option><option>Lada</option>
                    <option>Honda</option><option>Mazda</option><option>Suzuki</option><option>Peugeot</option>
                    <option>Tesla</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Цена за сутки (макс)</label>
                <input type="range" id="price-range" min="1000" max="15000" step="100" value="10000">
                <span id="price-value">до 10000 ₽</span>
            </div>
            <div class="filter-group checkbox-group">
                <label><input type="checkbox" class="smart-filter" data-filter="pets"> Можно с животными</label>
                <label><input type="checkbox" class="smart-filter" data-filter="unlimited"> Безлимит км</label>
                <label><input type="checkbox" class="smart-filter" data-filter="conditioner"> Кондиционер</label>
                <label><input type="checkbox" class="smart-filter" data-filter="automatic"> Автомат КПП</label>
            </div>
        </aside>

        <div class="car-list" id="car-list"></div>
    </div>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-telegram"></i> Telegram</a>
            <a href="#"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            <a href="#"><i class="fab fa-vk"></i> VK</a>
        </div>
        <p>© 2026 AutoRentPro — прокат авто с честными условиями</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
